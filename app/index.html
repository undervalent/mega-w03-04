<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="32c0a4c" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <div data-testid="loader" class="loader">Loading incidents…</div>
      <div data-testid="empty" class="empty" style="display: none;">No incidents tonight</div>
      <ul data-testid="incident-list" class="list" style="display: none;"></ul>
    </main>
    <div data-testid="confirm" id="confirm-modal" class="confirm-modal" style="display: none;">
      <div class="confirm-content">
        <p id="confirm-message">Acknowledge incident?</p>
        <div class="confirm-buttons">
          <button data-testid="confirm-ack" id="confirm-ack-btn" class="confirm-ack-btn">Ack</button>
          <button data-testid="confirm-cancel" id="confirm-cancel-btn" class="confirm-cancel-btn">Cancel</button>
        </div>
      </div>
    </div>
    <footer>sched-prod incident board · <span data-testid="build-sha">32c0a4c</span></footer>
  </body>
</html>
